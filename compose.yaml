services: 
  postgres: 
    image: pgvector/pgvector:pg16

    environment: 
      POSTGRES_USER: lexflow
      POSTGRES_PASSWORD: lexflow_dev
      POSTGRES_DB: lexflow

    ports: 
        - "5432:5432"

    volumes: 
        - lexflow_postgres_data:/var/lib/postgresql/data
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend: 
    build: . 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: 
      - "8000:8000"
    environment: 
      DATABASE_URL: postgresql://lexflow:lexflow_dev@postgres:5432/lexflow
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_DOCKER_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-llama3.2:3b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      OLLAMA_EMBEDDING_DIMENSION: ${OLLAMA_EMBEDDING_DIMENSION:-768}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_LLM_MODEL: ${OPENAI_LLM_MODEL:-gpt-4o-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_PROVIDER_TIMEOUT_SECONDS: ${AI_PROVIDER_TIMEOUT_SECONDS:-60}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-60}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    depends_on: 
      - postgres 
      
volumes:
  lexflow_postgres_data: