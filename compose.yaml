services: 
  postgres: 
    image: pgvector/pgvector:pg16

    environment: 
      POSTGRES_USER: lexflow
      POSTGRES_PASSWORD: lexflow_dev
      POSTGRES_DB: lexflow

    ports: 
        - "5432:5432"

    volumes: 
        - lexflow_postgres_data:/var/lib/postgresql/data
        - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend: 
    build: . 
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports: 
      - "8000:8000"
    environment: 
      DATABASE_URL: postgresql://lexflow:lexflow_dev@postgres:5432/lexflow
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
    depends_on: 
      - postgres 
      
volumes:
  lexflow_postgres_data: